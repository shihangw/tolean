# CI, in stages. `build` builds Tolean with `lake build --wfail` in the Nix
# shell and saves the Lean build cache. Then `typescript`, `certify` and
# `other` restore that cache and run, in parallel, every check that needs
# only the native build. `check` passes when all of them pass. They run on
# each pull request. `docs` builds the docs site from the Markdown files, on
# each pull request too. On main, `wasm-build` runs wasm.yml next to the
# checks. It builds the playground's WebAssembly translator, and `pages`
# publishes the playground with the docs under docs/. Only the published
# page needs WebAssembly, so pull requests skip it unless they change how it
# builds. The native binaries for the npm package build only in release.yml.
# On main, `release` starts that workflow when the push raised the version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main, each commit
# gets its own group, so every run finishes. The README's CI badge shows the
# last finished run on main, and it shows a cancelled run as failing.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the library and the tolean command, and saves the Lean build
  # cache for the jobs below. A runner has 4 CPUs, so the checks run in
  # several jobs at once instead of one after another in this one.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean-build
        with:
          save: true

  # In each check job, every step runs in the flake's dev shell: Lean, Node,
  # pnpm, Go, PostgreSQL and Graphviz at the pinned versions. Each job
  # restores the cache that `build` saved, so its own build only finds every
  # module current. Each job ends by requiring that its checks left no
  # change to a committed file.
  typescript:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean-build

      # A declaration can reach an .olean file without the kernel checking it:
      # `set_option debug.skipKernelTC true`, or a command that adds it with the
      # check off. The build still passes, and the theorem lists no axioms.
      # leanchecker sends every declaration of the library's .olean files to
      # the kernel again, the ones the cache restores included.
      - name: The kernel accepts the built library again
        run: lake env leanchecker tolean

      - name: Install the TypeScript checks' dependencies
        run: |
          (cd tests/typescript && pnpm install --frozen-lockfile)
          (cd npm && pnpm install --frozen-lockfile && pnpm build)

      - name: npm package tests
        working-directory: npm
        run: TOLEAN_BINARY=$PWD/../.lake/build/bin/tolean pnpm test

      - name: TypeScript parser against tsc
        working-directory: tests/typescript
        run: node check.ts

      - name: TypeScript translator on the corpus and on random programs
        working-directory: tests/typescript
        run: node checkTranslate.ts

      - name: Generated files are committed and current
        run: git diff --exit-code

  # The certificate check takes the longest, and it keeps every CPU busy, so
  # it runs in two jobs. Each one certifies half of the corpus files.
  certify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean-build

      - name: Per-file certificates for the translation corpus
        working-directory: tests/typescript
        run: SHARD=${{ matrix.shard }}/2 ./checkCertify.sh

      - name: Generated files are committed and current
        run: git diff --exit-code

  other:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean-build

      - name: JS number laws and the interpreter, on every maintained Node release line
        run: nix run .#test-engines

      - name: Go parser and translator against go/parser
        working-directory: tests/go
        run: go run ./check

      - name: SQL translator against PostgreSQL
        working-directory: tests/sql
        run: go run ./pgcheck corpus

      - name: Chain manifests on the sample project
        working-directory: tests/chain
        run: ./check.sh

      - name: Playground examples translate and their proofs check
        run: |
          for example in playground/examples/*/; do
            (cd "$example" && ../../../.lake/build/bin/tolean translate --check && lake build --wfail)
          done

      - name: Generated files are committed and current
        run: git diff --exit-code

  # Branch protection requires a check named `check`. It used to be the one
  # job that ran every check above. Now this job reports under that name: it
  # passes when every check job passed, and it fails when one failed or was
  # skipped. A cancelled run skips it.
  check:
    needs: [build, typescript, certify, other]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a check job ended with $r" >&2; exit 1; }
          done

  # The docs site: VitePress builds README.md and docs/ into the pages under
  # /tolean/docs/. The build fails on a dead link or anchor, on two files
  # that would be the same page, and on a plan without a status. It needs
  # no Lean, so it does not wait for `build`.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#docs --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build the docs site
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # wasm.yml puts the site next to the playground.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error

  # Decides whether the WebAssembly build runs. It always runs on main and by
  # hand. A pull request runs it only when it changes something that only the
  # build uses: wasm/, the playground site, wasm.yml, or the lean-build action
  # that wasm.yml shares with `build`. The Lean toolchain and the flake count
  # too, because build.sh patches the Lean runtime at the toolchain's tag and
  # the flake pins emscripten. The check jobs already build and test the
  # translator, so a change to tolean/ alone does not run it.
  #
  # An edit to this file does not run the build, so a pull request that
  # changes `wasm-build`, `wasm` or the pattern below should start ci by hand
  # on its branch: `gh workflow run ci.yml --ref <branch>`.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.diff.outputs.wasm }}
    steps:
      # A pull request checks out a merge commit. Its first parent is the base
      # branch, so the diff against it is what the pull request changes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
              grep -E '^(wasm/|playground/site/|flake\.(nix|lock)$|lean-toolchain$|\.github/workflows/wasm\.yml$|\.github/actions/)' >/dev/null; then
            echo wasm=true >> "$GITHUB_OUTPUT"
          fi

  # The WebAssembly build, in wasm.yml. It restores the Lean cache that
  # `build` saved, so it waits for `build` and runs next to the check jobs.
  # It also waits for `docs`, whose site it publishes.
  wasm-build:
    needs: [changes, build, docs]
    if: needs.changes.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm.yml

  # Branch protection requires a check named `wasm`, but a called workflow's
  # job reports as `wasm-build / build`. So this job reports under the old
  # name. It passes when the build passed or `changes` skipped it. It fails
  # when the build, or a job that the build waits for, failed. A cancelled
  # run skips it.
  wasm:
    needs: [changes, check, docs, wasm-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "a job that wasm waits for ended with $r" >&2; exit 1 ;;
            esac
          done

  # The WebAssembly build no longer waits for the checks, so `pages` waits
  # for `check` itself: main publishes only a commit that passed every check.
  pages:
    needs: [check, wasm-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time. A deploy that is running always finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Starts the npm release when the version in npm/package.json has no
  # release yet, after every check above passed. The release builds and
  # publishes the commit at the tip of main, and it waits for approval in the
  # `npm` environment. While a release is queued, waiting or running, a push
  # starts no other. So after a bump, the first push that passes CI starts
  # the release, and a later push starts one only if it failed. To pause
  # releases, disable release.yml with `gh workflow disable release.yml`.
  # This job then skips, and nobody can start a release by hand either.
  #
  # The job asks GitHub before npm. The GitHub release is the last thing that
  # release.yml makes, so it exists only when a release is complete. When npm
  # has the version but GitHub has no release, the last step failed. Then the
  # job warns and starts nothing, because a full release run would rebuild
  # everything just to make the tag. Run release.yml by hand to finish it.
  # Deletes the caches on this run's ref that no run will restore again:
  # each kind keeps only its newest cache. Without this, every push to a
  # pull request leaves another Lean cache of about 125 MB, and the
  # repository goes over GitHub's 10 GB limit. cache-cleanup.yml deletes the
  # rest when the pull request closes.
  prune-caches:
    needs: [check, wasm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-caches.sh "$GITHUB_REF"

  release:
    needs: [check, docs, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Start the release when this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" -q .state)
          if [ "$state" != active ]; then
            echo "release.yml is $state, so releases are paused. Run 'gh workflow enable release.yml' to resume them."
            exit 0
          fi
          v=$(jq -r .version npm/package.json)
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v has a GitHub release, so there is nothing to release"
            exit 0
          fi
          open=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 \
            --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$open" != 0 ]; then
            echo "a release is already queued or running, so this push starts no other"
            exit 0
          fi
          if [ -n "$(npm view "tolean@$v" version 2>/dev/null)" ]; then
            echo "::warning::tolean@$v is on npm, but v$v has no GitHub release. Run release.yml by hand with publish set to finish it."
            exit 0
          fi
          echo "v$v has no release, so the release starts"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref main -f publish=true
