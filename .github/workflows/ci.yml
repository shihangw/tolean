# CI, in stages. `check` builds Tolean with `lake build --wfail` in the Nix
# shell and runs every check that needs only the native build. It runs on
# each pull request. `docs` builds the docs site from the Markdown files, on
# each pull request too. On main, `wasm` then builds the playground's
# WebAssembly translator and `pages` publishes the playground with the docs
# under docs/. Only the published page needs WebAssembly, so pull requests
# skip `wasm` unless they change how it builds. The native binaries for the
# npm package build only in release.yml. On main, `release` starts that
# workflow when the push raised the version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main, each commit
# gets its own group, so every run finishes. The README's CI badge shows the
# last finished run on main, and it shows a cancelled run as failing.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        # Every step runs in the flake's dev shell: Lean, Node, pnpm, Go,
        # PostgreSQL and Graphviz at the pinned versions.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Lean build output
        uses: actions/cache@v5
        with:
          path: |
            .lake
            tests/chain/.lake
            playground/examples/*/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-

      # The cache can be from an older commit, and Lake never deletes the build
      # output of a module whose source was deleted since. Nothing imports such
      # a module, so the build does not notice, but leanchecker below checks
      # every .olean file of the library, and a stale one can name constants
      # that no longer exist.
      - name: Remove the build output of deleted modules
        run: |
          if [ -d .lake/build/lib/lean/tolean ]; then
            find .lake/build/lib/lean/tolean -type f | while read -r f; do
              rel=${f#.lake/build/lib/lean/}
              [ -f "${rel%%.*}.lean" ] || rm "$f"
            done
          fi

      - name: Build the library and the tolean command
        run: lake build --wfail

      # A declaration can reach an .olean file without the kernel checking it:
      # `set_option debug.skipKernelTC true`, or a command that adds it with the
      # check off. The build still passes, and the theorem lists no axioms.
      # leanchecker sends every declaration of the library's .olean files to
      # the kernel again, the ones the cache above restores included.
      - name: The kernel accepts the built library again
        run: lake env leanchecker tolean

      - name: Install the TypeScript checks' dependencies
        run: |
          (cd tests/typescript && pnpm install --frozen-lockfile)
          (cd npm && pnpm install --frozen-lockfile && pnpm build)

      - name: npm package tests
        working-directory: npm
        run: TOLEAN_BINARY=$PWD/../.lake/build/bin/tolean pnpm test

      - name: TypeScript parser against tsc
        working-directory: tests/typescript
        run: node check.ts

      - name: TypeScript translator on the corpus and on random programs
        working-directory: tests/typescript
        run: node checkTranslate.ts

      - name: Per-file certificates for the translation corpus
        working-directory: tests/typescript
        run: ./checkCertify.sh

      - name: JS number laws and the interpreter, on every maintained Node release line
        run: nix run .#test-engines

      - name: Go parser and translator against go/parser
        working-directory: tests/go
        run: go run ./check

      - name: SQL translator against PostgreSQL
        working-directory: tests/sql
        run: go run ./pgcheck corpus

      - name: Chain manifests on the sample project
        working-directory: tests/chain
        run: ./check.sh

      - name: Playground examples translate and their proofs check
        run: |
          for example in playground/examples/*/; do
            (cd "$example" && ../../../.lake/build/bin/tolean translate --check && lake build --wfail)
          done

      - name: Generated files are committed and current
        run: git diff --exit-code

  # The docs site: VitePress builds README.md and docs/ into the pages under
  # /tolean/docs/. The build fails on a dead link or anchor, on two files
  # that would be the same page, and on a plan without a status. It needs
  # no Lean, so it does not wait for `check`.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#docs --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build the docs site
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `wasm` puts the site next to the playground.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error

  # Decides whether `wasm` runs. It always runs on main and by hand. A pull
  # request runs it only when it changes something that only `wasm` uses:
  # wasm/, the playground site, or this workflow. The Lean toolchain and the
  # flake count too, because build.sh patches the Lean runtime at the
  # toolchain's tag and the flake pins emscripten. `check` already builds and
  # tests the translator, so a change to tolean/ alone does not run `wasm`.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.diff.outputs.wasm }}
    steps:
      # A pull request checks out a merge commit. Its first parent is the base
      # branch, so the diff against it is what the pull request changes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
              grep -E '^(wasm/|playground/site/|flake\.(nix|lock)$|lean-toolchain$|\.github/workflows/ci\.yml$)' >/dev/null; then
            echo wasm=true >> "$GITHUB_OUTPUT"
          fi

  # The playground's WebAssembly translator: build it, require that it gives
  # the native result on the corpus and on random programs, and check the
  # examples' proofs on the Lean that runs in the browser.
  wasm:
    needs: [changes, check, docs]
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Lean build output
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Build the tolean command
        run: lake build --wfail

      - name: Cache the translator's WebAssembly build
        uses: actions/cache@v5
        with:
          path: wasm/.build
          key: translator-wasm-${{ hashFiles('lean-toolchain', 'flake.lock', 'wasm/build.sh') }}-${{ hashFiles('tolean/**/*.lean', 'wasm/*.lean', 'wasm/glue.c') }}
          restore-keys: translator-wasm-${{ hashFiles('lean-toolchain', 'flake.lock', 'wasm/build.sh') }}-

      - name: Build the translator as WebAssembly
        shell: nix develop .#wasm --command bash -euo pipefail {0}
        run: wasm/build.sh

      - name: The WebAssembly translator gives the native result
        working-directory: tests/typescript
        run: |
          pnpm install --frozen-lockfile
          node checkTranslate.ts --require-wasm

      - name: Cache the Lean that runs in the browser
        uses: actions/cache@v5
        with:
          path: playground/site/.cache/*.tar.gz
          key: lean-wasm-${{ hashFiles('playground/site/lean-runtime.json') }}

      - name: Build the playground
        working-directory: playground/site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Playground examples prove on the Lean that runs in the browser
        working-directory: playground/site
        run: node scripts/check-wasm.ts

      - uses: actions/upload-artifact@v6
        with:
          name: tolean-wasm
          path: wasm/out
          if-no-files-found: error

      # The docs are served under /tolean/docs/, next to the playground.
      # `docs` uploads them only outside pull requests.
      - if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: playground/site/dist/docs

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/site/dist

  pages:
    needs: wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time. A deploy that is running always finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Starts the npm release when the version in npm/package.json has no
  # release yet, after every check above passed. The release builds and
  # publishes the commit at the tip of main, and it waits for approval in the
  # `npm` environment. While a release is queued, waiting or running, a push
  # starts no other. So after a bump, the first push that passes CI starts
  # the release, and a later push starts one only if it failed. To pause
  # releases, disable release.yml with `gh workflow disable release.yml`.
  # This job then skips, and nobody can start a release by hand either.
  #
  # The job asks GitHub before npm. The GitHub release is the last thing that
  # release.yml makes, so it exists only when a release is complete. When npm
  # has the version but GitHub has no release, the last step failed. Then the
  # job warns and starts nothing, because a full release run would rebuild
  # everything just to make the tag. Run release.yml by hand to finish it.
  release:
    needs: [check, docs, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Start the release when this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" -q .state)
          if [ "$state" != active ]; then
            echo "release.yml is $state, so releases are paused. Run 'gh workflow enable release.yml' to resume them."
            exit 0
          fi
          v=$(jq -r .version npm/package.json)
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v has a GitHub release, so there is nothing to release"
            exit 0
          fi
          open=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 \
            --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$open" != 0 ]; then
            echo "a release is already queued or running, so this push starts no other"
            exit 0
          fi
          if [ -n "$(npm view "tolean@$v" version 2>/dev/null)" ]; then
            echo "::warning::tolean@$v is on npm, but v$v has no GitHub release. Run release.yml by hand with publish set to finish it."
            exit 0
          fi
          echo "v$v has no release, so the release starts"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref main -f publish=true
