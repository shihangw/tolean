# TEMPORARY: compares GCC and clang on a cold `lake build`. Remove this file
# before the pull request merges.
name: cc-bench

on:
  pull_request:
    paths: [.github/workflows/cc-bench.yml]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Fetch the dev shell first, so its download does not count.
      - run: nix develop --command lean --version

      - name: Cold lake build with ${{ matrix.cc }}
        run: |
          out=$(nix build --inputs-from . nixpkgs#${{ matrix.cc }} --no-link --print-out-paths)
          export LEAN_CC=$out/bin/${{ matrix.cc }}
          "$LEAN_CC" --version | head -1
          start=$(date +%s)
          nix develop --command lake build --wfail 2>&1 | tee build.log
          echo "wall: $(( $(date +%s) - start )) s"

      - name: Summary
        run: |
          nproc
          grep -E 'Built .*\([0-9.]+m?s\)' build.log | sed -E 's/.*Built ([^ ]+) .*\(([0-9.]+)(m?s)\).*/\1 \2 \3/' |
            awk '{ t = ($3 == "ms") ? $2 / 1000 : $2; if ($1 ~ /:c\.o/) c += t; else if ($1 ~ /:/) o += t; else l += t }
                 END { printf "C compile: %d s\nLean elaboration: %d s\nother: %d s\n", c, l, o }'
          echo "slowest C files:"
          grep -E 'Built .*:c\.o' build.log | sed -E 's/.*Built ([^ ]+) .*\(([0-9.]+)s\).*/\2 \1/' | sort -rn | head -8
