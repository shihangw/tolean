# Builds the playground in playground/site and publishes it to GitHub Pages,
# on each push to main that changes the playground or the Go Spec it bundles.
name: pages

on:
  push:
    branches: [main]
    paths:
      - playground/**
      - wasm/**
      - tolean/**
      - flake.nix
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache the Lean that runs in the browser
        uses: actions/cache@v4
        with:
          path: playground/site/.cache/*.tar.gz
          key: lean-wasm-${{ hashFiles('playground/site/lean-runtime.json') }}

      - name: Cache the translator's WebAssembly build
        uses: actions/cache@v4
        with:
          path: wasm/.build
          key: translator-wasm-${{ hashFiles('lean-toolchain', 'flake.lock', 'wasm/build.sh') }}-${{ hashFiles('tolean/**/*.lean', 'wasm/*.lean', 'wasm/glue.c') }}
          restore-keys: translator-wasm-${{ hashFiles('lean-toolchain', 'flake.lock', 'wasm/build.sh') }}-

      - name: Build the translator as WebAssembly
        shell: nix develop .#wasm --command bash -euo pipefail {0}
        run: wasm/build.sh

      - name: Build the playground
        working-directory: playground/site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
