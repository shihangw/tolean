<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">tolean pipeline: what is proved and what is trusted</title>
  <desc id="desc">TypeScript source goes through tsc and the tolean translator to generated Lean, where proofs check the claims. A planned certificate path dumps the AST and evaluates it with a Lean JavaScript interpreter. The same source is type-stripped and runs in Node.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #202124; }
      .head { font-size: 13px; font-weight: 700; fill: #5f6368; letter-spacing: 0.04em; }
      .name { font-size: 14px; font-weight: 700; fill: #202124; }
      .sub { font-size: 12px; fill: #3c4043; }
      .note { font-size: 12px; fill: #3c4043; }
      .line { stroke: #3c4043; stroke-width: 1.5; fill: none; }
      .dash { stroke: #5f6368; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .proved { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; }
      .tested { fill: #fef7e0; stroke: #b06000; stroke-width: 2; }
      .untested { fill: #fce8e6; stroke: #c5221f; stroke-width: 2; }
      .generated { fill: #f1f3f4; stroke: #5f6368; stroke-width: 2; }
      .planned { fill: #ffffff; stroke: #5f6368; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="30" y="32" class="title">tolean: what is proved and what is trusted</text>

  <!-- Source -->
  <rect x="350" y="50" width="260" height="56" rx="8" class="generated"/>
  <text x="480" y="74" text-anchor="middle" class="name">x.ts</text>
  <text x="480" y="93" text-anchor="middle" class="sub">TypeScript in the tolean subset</text>

  <path d="M480,106 V125" class="line"/>
  <path d="M270,125 H690" class="line"/>
  <path d="M270,125 V163" class="line" marker-end="url(#arrow)"/>
  <path d="M690,125 V163" class="line" marker-end="url(#arrow)"/>

  <text x="160" y="152" text-anchor="middle" class="head">PROOF PATH (TODAY)</text>
  <text x="480" y="152" text-anchor="middle" class="head">CERTIFICATE (PLANNED)</text>
  <text x="800" y="152" text-anchor="middle" class="head">WHAT RUNS</text>

  <!-- Proof path -->
  <rect x="30" y="165" width="260" height="64" rx="8" class="tested"/>
  <text x="160" y="192" text-anchor="middle" class="name">tsc: parse and type-check</text>
  <text x="160" y="212" text-anchor="middle" class="sub">AST and types (reference compiler)</text>
  <path d="M160,229 V263" class="line" marker-end="url(#arrow)"/>

  <rect x="30" y="265" width="260" height="64" rx="8" class="untested"/>
  <text x="160" y="292" text-anchor="middle" class="name">tolean translator</text>
  <text x="160" y="312" text-anchor="middle" class="sub">trusted: rejection tests and review</text>
  <path d="M160,329 V363" class="line" marker-end="url(#arrow)"/>

  <rect x="30" y="365" width="260" height="64" rx="8" class="generated"/>
  <text x="160" y="392" text-anchor="middle" class="name">X.lean (generated)</text>
  <text x="160" y="412" text-anchor="middle" class="sub">readable Lean definitions (generated)</text>
  <path d="M160,429 V463" class="line" marker-end="url(#arrow)"/>

  <rect x="30" y="465" width="260" height="64" rx="8" class="proved"/>
  <text x="160" y="492" text-anchor="middle" class="name">Proof/X.lean + #audit_claims</text>
  <text x="160" y="512" text-anchor="middle" class="sub">every claim in Spec/X.lean holds</text>

  <rect x="30" y="565" width="260" height="64" rx="8" class="tested"/>
  <text x="160" y="592" text-anchor="middle" class="name">TypeScript Spec: number laws</text>
  <text x="160" y="612" text-anchor="middle" class="sub">SafeIntLaws, SpecialValueLaws</text>
  <path d="M160,565 V531" class="line" marker-end="url(#arrow)"/>
  <text x="168" y="552" class="note">hypotheses</text>

  <!-- Certificate path -->
  <path d="M290,197 H320 V297 H348" class="dash" marker-end="url(#arrow)"/>
  <rect x="350" y="265" width="260" height="64" rx="8" class="planned"/>
  <text x="480" y="292" text-anchor="middle" class="name">AST dump</text>
  <text x="480" y="312" text-anchor="middle" class="sub">the tsc AST as Lean data (Program)</text>
  <path d="M480,329 V363" class="dash" marker-end="url(#arrow)"/>

  <rect x="350" y="365" width="260" height="64" rx="8" class="planned"/>
  <text x="480" y="392" text-anchor="middle" class="name">eval: JS interpreter in Lean</text>
  <text x="480" y="412" text-anchor="middle" class="sub">the trusted model of JavaScript</text>

  <path d="M292,397 H348" class="dash" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="450" text-anchor="middle" class="note">f.source: eval(Program) = the definition,</text>
  <text x="480" y="466" text-anchor="middle" class="note">proved per file, so the translator is not trusted</text>

  <!-- What runs -->
  <rect x="670" y="165" width="260" height="64" rx="8" class="tested"/>
  <text x="800" y="192" text-anchor="middle" class="name">type stripping or bundler</text>
  <text x="800" y="212" text-anchor="middle" class="sub">removes types only</text>
  <path d="M800,229 V263" class="line" marker-end="url(#arrow)"/>

  <rect x="670" y="265" width="260" height="64" rx="8" class="generated"/>
  <text x="800" y="292" text-anchor="middle" class="name">JavaScript in Node</text>
  <text x="800" y="312" text-anchor="middle" class="sub">production</text>

  <rect x="670" y="365" width="260" height="64" rx="8" class="planned"/>
  <text x="800" y="392" text-anchor="middle" class="name">boundary guards</text>
  <text x="800" y="412" text-anchor="middle" class="sub">inputs meet the theorems' preconditions</text>
  <path d="M800,365 V331" class="dash" marker-end="url(#arrow)"/>

  <path d="M668,297 H640 V397 H612" class="dash" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="450" text-anchor="middle" class="note">differential test (planned):</text>
  <text x="800" y="466" text-anchor="middle" class="note">the interpreter against Node</text>

  <!-- Law tests -->
  <path d="M292,597 H950 V297 H932" class="dash" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="620" y="589" text-anchor="middle" class="note">jsNumberLaws.test.ts: each law checked against Node doubles</text>

  <!-- Legend -->
  <rect x="30" y="655" width="18" height="18" rx="3" class="proved"/>
  <text x="56" y="669" class="sub">proved by Lean</text>
  <rect x="190" y="655" width="18" height="18" rx="3" class="tested"/>
  <text x="216" y="669" class="sub">trusted, tested</text>
  <rect x="350" y="655" width="18" height="18" rx="3" class="untested"/>
  <text x="376" y="669" class="sub">trusted, no proof (translator today)</text>
  <rect x="620" y="655" width="18" height="18" rx="3" class="generated"/>
  <text x="646" y="669" class="sub">generated or runtime</text>
  <rect x="790" y="655" width="18" height="18" rx="3" class="planned"/>
  <text x="816" y="669" class="sub">planned</text>
</svg>
