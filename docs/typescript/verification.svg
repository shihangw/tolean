<svg xmlns="http://www.w3.org/2000/svg" width="980" height="770" viewBox="0 0 980 770" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript: what is proved and what is trusted</title>
  <desc id="desc">TypeScript source goes through Tolean's Lean parser and translator, both tested against tsc, to generated Lean definitions. People review the claims, and the Lean kernel checks the proofs. The JavaScript number laws are tested against Node. What runs is the type-stripped source on Node. A planned certificate would prove that the generated definitions mean what the source means.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #202124; }
      .head { font-size: 12px; font-weight: 700; fill: #5f6368; letter-spacing: 0.05em; }
      .name { font-size: 14px; font-weight: 700; fill: #202124; }
      .sub { font-size: 11.5px; fill: #3c4043; }
      .edge { font-size: 11px; fill: #5f6368; font-style: italic; }
      .line { stroke: #3c4043; stroke-width: 1.5; fill: none; }
      .dash { stroke: #5f6368; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .check { stroke: #b06000; stroke-width: 1.5; fill: none; stroke-dasharray: 2 3; }
      .proved { fill: #e6f4ea; stroke: #1e8e3e; stroke-width: 2; }
      .tested { fill: #fef7e0; stroke: #b06000; stroke-width: 2; }
      .untested { fill: #fce8e6; stroke: #c5221f; stroke-width: 2; }
      .generated { fill: #f1f3f4; stroke: #5f6368; stroke-width: 2; }
      .human { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
      .planned { fill: #ffffff; stroke: #5f6368; stroke-width: 2; stroke-dasharray: 6 4; }
      .ref { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="980" height="770" fill="#ffffff"/>
  <text x="30" y="34" class="title">TypeScript: what is proved and what is trusted</text>

  <text x="170" y="74" text-anchor="middle" class="head">TRANSLATION</text>
  <text x="490" y="74" text-anchor="middle" class="head">LEAN</text>
  <text x="820" y="74" text-anchor="middle" class="head">WHAT RUNS</text>

  <!-- Source -->
  <rect x="40" y="85" width="260" height="52" rx="8" class="generated"/>
  <text x="170" y="107" text-anchor="middle" class="name">x.ts</text>
  <text x="170" y="125" text-anchor="middle" class="sub">source in the Tolean subset</text>

  <!-- Parser -->
  <path d="M170,137 V167" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="169" width="260" height="62" rx="8" class="tested"/>
  <text x="170" y="192" text-anchor="middle" class="name">Lean parser</text>
  <text x="170" y="210" text-anchor="middle" class="sub">trees and spans equal tsc's on the corpus</text>
  <text x="170" y="224" text-anchor="middle" class="sub">and 500 random programs per run</text>

  <!-- Translator -->
  <path d="M170,231 V261" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="263" width="260" height="62" rx="8" class="tested"/>
  <text x="170" y="286" text-anchor="middle" class="name">Lean translator and type checker</text>
  <text x="170" y="304" text-anchor="middle" class="sub">corpus output fixed by golden files;</text>
  <text x="170" y="318" text-anchor="middle" class="sub">output for random programs compiles</text>

  <!-- tsc reference -->
  <rect x="40" y="365" width="260" height="46" rx="8" class="ref"/>
  <text x="170" y="386" text-anchor="middle" class="name">tsc</text>
  <text x="170" y="402" text-anchor="middle" class="sub">reference that the parser is compared against</text>
  <path d="M300,388 H318 V200 H302" class="check"/>

  <!-- Generated Lean -->
  <path d="M300,294 H358" class="line" marker-end="url(#arrow)"/>
  <rect x="360" y="263" width="260" height="62" rx="8" class="generated"/>
  <text x="490" y="286" text-anchor="middle" class="name">Generated Lean definitions</text>
  <text x="490" y="304" text-anchor="middle" class="sub">regenerated in CI; a drift check fails</text>
  <text x="490" y="318" text-anchor="middle" class="sub">if they differ from the committed copy</text>

  <!-- Number laws -->
  <rect x="360" y="85" width="260" height="62" rx="8" class="tested"/>
  <text x="490" y="108" text-anchor="middle" class="name">JS number Spec and laws</text>
  <text x="490" y="126" text-anchor="middle" class="sub">SafeIntLaws, SpecialValueLaws: tested</text>
  <text x="490" y="140" text-anchor="middle" class="sub">against real doubles on Node 22 and 24</text>
  <path d="M490,147 V261" class="line" marker-end="url(#arrow)"/>
  <text x="496" y="210" class="edge">imported by</text>

  <!-- Claims -->
  <rect x="420" y="375" width="200" height="56" rx="8" class="human"/>
  <text x="520" y="398" text-anchor="middle" class="name">Claims (Spec files)</text>
  <text x="520" y="416" text-anchor="middle" class="sub">what people read</text>

  <!-- Proofs -->
  <path d="M385,325 V471" class="line" marker-end="url(#arrow)"/>
  <path d="M520,431 V471" class="line" marker-end="url(#arrow)"/>
  <rect x="360" y="473" width="260" height="62" rx="8" class="proved"/>
  <text x="490" y="496" text-anchor="middle" class="name">Proofs</text>
  <text x="490" y="514" text-anchor="middle" class="sub">checked by the Lean kernel; #audit_claims</text>
  <text x="490" y="528" text-anchor="middle" class="sub">requires one theorem per claim, no sorry</text>

  <!-- Certificate (planned) -->
  <rect x="360" y="585" width="260" height="62" rx="8" class="planned"/>
  <text x="490" y="608" text-anchor="middle" class="name">Certificate (planned)</text>
  <text x="490" y="626" text-anchor="middle" class="sub">a JS interpreter in Lean, and a proof that</text>
  <text x="490" y="640" text-anchor="middle" class="sub">eval(AST) equals the generated definitions</text>
  <path d="M40,200 H24 V616 H358" class="dash" marker-end="url(#arrow)"/>
  <text x="40" y="606" class="edge">AST as Lean data, from the Lean parser</text>
  <path d="M490,585 V537" class="dash" marker-end="url(#arrow)"/>
  <text x="496" y="566" class="edge">would remove the translator from what is trusted</text>

  <!-- What runs -->
  <rect x="690" y="85" width="260" height="62" rx="8" class="untested"/>
  <text x="820" y="108" text-anchor="middle" class="name">Type stripping</text>
  <text x="820" y="126" text-anchor="middle" class="sub">trusted to leave the code unchanged;</text>
  <text x="820" y="140" text-anchor="middle" class="sub">the subset avoids anything it rewrites</text>
  <path d="M300,111 H335 V50 H930 V83" class="line" marker-end="url(#arrow)"/>

  <path d="M820,147 V175" class="line" marker-end="url(#arrow)"/>
  <rect x="690" y="177" width="260" height="62" rx="8" class="tested"/>
  <text x="820" y="200" text-anchor="middle" class="name">Node runs x.ts</text>
  <text x="820" y="218" text-anchor="middle" class="sub">the engine the number laws were</text>
  <text x="820" y="232" text-anchor="middle" class="sub">tested on (Node 22 and 24)</text>

  <rect x="690" y="473" width="260" height="62" rx="8" class="untested"/>
  <text x="820" y="496" text-anchor="middle" class="name">Callers' inputs</text>
  <text x="820" y="514" text-anchor="middle" class="sub">must meet the theorems' preconditions;</text>
  <text x="820" y="528" text-anchor="middle" class="sub">not checked yet (boundary guards planned)</text>
  <path d="M688,504 H622" class="line" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40,690)">
    <rect x="0" y="0" width="18" height="14" rx="3" class="proved"/><text x="24" y="12" class="sub">proved</text>
    <rect x="90" y="0" width="18" height="14" rx="3" class="tested"/><text x="114" y="12" class="sub">trusted, tested</text>
    <rect x="230" y="0" width="18" height="14" rx="3" class="untested"/><text x="254" y="12" class="sub">trusted, not tested</text>
    <rect x="390" y="0" width="18" height="14" rx="3" class="generated"/><text x="414" y="12" class="sub">generated or input</text>
    <rect x="540" y="0" width="18" height="14" rx="3" class="human"/><text x="564" y="12" class="sub">read by people</text>
    <rect x="670" y="0" width="18" height="14" rx="3" class="planned"/><text x="694" y="12" class="sub">planned</text>
    <path d="M770,7 H800" class="check"/><text x="806" y="12" class="sub">compared in tests</text>
  </g>
  <text x="40" y="735" class="sub">A theorem holds for the code that runs if the translation, the number laws, type stripping and Node are as trusted,</text>
  <text x="40" y="751" class="sub">and callers meet its preconditions.</text>
</svg>
